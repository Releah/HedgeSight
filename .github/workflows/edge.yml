name: Publish edge containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: edge-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      matrix:
        include:
          - image: hedgesight-app
            file: Dockerfile
          - image: hedgesight-worker
            file: Dockerfile.worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/releah/${{ matrix.image }}:edge
          build-args: HEDGESIGHT_VERSION=edge-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=min
          sbom: true
